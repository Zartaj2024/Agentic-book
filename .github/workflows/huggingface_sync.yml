name: Sync to Hugging Face hub
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Create a temporary directory to build a clean state
          mkdir ../hf-sync-temp
          cp -R . ../hf-sync-temp/
          cd ../hf-sync-temp

          # Remove .git and offending files
          rm -rf .git
          rm -f Gemini_Generated_Image_950gvb950gvb950g.png textbook.pdf

          # Initialize new repo and commit
          git init -b main
          git add .
          git commit -m "Deploy Physical AI Book to Hugging Face (Clean Build)"

          # Force push to HF main
          git push https://x:$HF_TOKEN@huggingface.co/spaces/${{ secrets.HF_SPACE_ID }} main --force
